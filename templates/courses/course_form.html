{% extends 'base.html' %}
{% block title %}{% if object %}Edit Course{% else %}Add Course{% endif %} - CloudStudent{% endblock %}
{% block page_title %}{% if object %}Edit Course{% else %}Add Course{% endif %}{% endblock %}

{% block content %}
<div class="card p-4 mx-auto" style="max-width: 800px;">
    <form method="post">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-12">
                {{ form.as_p }}
            </div>
        </div>
        <div class="mt-4 text-end">
            <a href="{% url 'courses:list' %}" class="btn btn-secondary me-2">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Course</button>
        </div>
    </form>
</div>
{% endblock %}
