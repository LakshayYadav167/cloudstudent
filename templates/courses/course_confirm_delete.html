{% extends 'base.html' %}
{% block title %}Confirm Deletion - CloudStudent{% endblock %}
{% block page_title %}Delete Course{% endblock %}

{% block content %}
<div class="card p-4 mx-auto text-center" style="max-width: 500px;">
    <i class="bi bi-exclamation-triangle text-danger mb-3" style="font-size: 3rem;"></i>
    <h4 class="fw-bold mb-3">Confirm Deletion</h4>
    <p class="mb-4">Are you sure you want to delete the course <strong>{{ object.code }} - {{ object.name }}</strong>?</p>
    
    <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'courses:list' %}" class="btn btn-secondary px-4">Cancel</a>
            <button type="submit" class="btn btn-danger px-4">Delete</button>
        </div>
    </form>
</div>
{% endblock %}
