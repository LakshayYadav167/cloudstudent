<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CloudStudent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card text-center">
            <div class="mb-4">
                <i class="bi bi-cloud-check-fill text-primary" style="font-size: 3rem;"></i>
                <h3 class="fw-bold mt-2">CloudStudent</h3>
                <p class="text-muted">Sign in to your account</p>
            </div>

            {% if form.errors %}
                <div class="alert alert-danger shadow-sm">
                    Your username and password didn't match. Please try again.
                </div>
            {% endif %}

            <form method="post" action="{% url 'accounts:login' %}">
                {% csrf_token %}
                <div class="form-floating mb-3 text-start">
                    <input type="text" name="username" class="form-control" id="id_username" placeholder="Username" required>
                    <label for="id_username">Username</label>
                </div>
                <div class="form-floating mb-4 text-start">
                    <input type="password" name="password" class="form-control" id="id_password" placeholder="Password" required>
                    <label for="id_password">Password</label>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fs-5">Sign In</button>
            </form>
            
            <div class="mt-4 text-muted small">
                &copy; 2024 CloudStudent System
            </div>
        </div>
    </div>
</body>
</html>
