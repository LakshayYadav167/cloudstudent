name: CloudStudent CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cloudstudent_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: cloudstudent.settings
      SECRET_KEY: django-insecure-test-key-ci-environment-only
      DEBUG: 'False'
      DATABASE_URL: postgres://testuser:testpassword@localhost:5432/cloudstudent_test
      ALLOWED_HOSTS: 'localhost,127.0.0.1'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django system checks
      run: python manage.py check

    - name: Run migrations
      run: python manage.py migrate --noinput

    - name: Run pytest
      run: python -m pytest

    - name: Build Docker image
      run: docker build -t cloudstudent:test .
